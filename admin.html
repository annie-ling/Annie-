<!doctype html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>感情解析｜管理後台</title><link rel="stylesheet" href="admin.css"></head><body>
<main class="wrap">
<section class="hero"><span class="eyebrow">PRIVATE ADMIN</span><h1>感情解析管理後台</h1><p>NT$149 解鎖碼・銷售漏斗・使用狀態</p></section>
<section id="loginCard" class="card"><h2>管理員登入</h2><p class="muted">使用你在 Supabase Auth 建立的管理員帳號。</p><label>Email<input id="email" type="email" autocomplete="username"></label><label>密碼<input id="password" type="password" autocomplete="current-password"></label><button id="loginBtn" class="primary">登入後台</button><p id="loginMsg" class="msg"></p></section>
<section id="adminApp" class="hidden">
<div class="topbar"><div><b id="adminEmail"></b><span class="muted">已驗證管理員</span></div><button id="logoutBtn" class="ghost">登出</button></div>
<div class="stats"><article><span>免費結果</span><strong id="sResult">—</strong></article><article><span>點擊 NT$149</span><strong id="sClick">—</strong><small id="sClickRate">—</small></article><article><span>付費解鎖</span><strong id="sPaid">—</strong><small id="sPaidRate">—</small></article><article><span>有效代碼</span><strong id="sCodes">—</strong></article></div>
<section class="card"><div class="sectionHead"><div><h2>建立客人解鎖碼</h2><p class="muted">收到 NT$149 後再產生。代碼只會完整顯示這一次。</p></div></div><div class="grid"><label>客人暱稱／備註<input id="codeLabel" placeholder="例如：小安 9/20"></label><label>可啟用裝置數<input id="maxUses" type="number" min="1" value="1"></label><label>到期日（選填）<input id="expiresAt" type="date"></label></div><button id="generateBtn" class="primary">產生 NT$149 專屬碼</button><div id="newCodeBox" class="codeBox hidden"><span>傳給客人的解鎖碼</span><strong id="newCode"></strong><button id="copyBtn" class="ghost">複製代碼</button></div><p id="generateMsg" class="msg"></p></section>
<section class="card"><div class="sectionHead"><div><h2>最近解鎖碼</h2><p class="muted">基於安全性，舊代碼不會再次顯示明碼；可查看使用狀態或停用。</p></div><button id="refreshBtn" class="ghost">重新整理</button></div><div id="codesList" class="codes"></div></section>
</section></main><script type="module" src="admin.js"></script></body></html>
